name: Frontend e2e
# Playwright e2e for the frontend (hermetic: every /api call is mocked, no backend or database).
# Separate from docker-build.yml so a browser test never blocks or slows the image build, and so
# it shows as its own check on pull requests. Public repo: GitHub-hosted runner only.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/e2e.yml'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Type-check e2e
        run: npm run typecheck:e2e
        working-directory: frontend
      - name: Run e2e
        run: npm run test:e2e
        working-directory: frontend
        env:
          CI: 'true'
      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 7
