name: notez-mcp
# Install, test and build the notez-mcp package. Separate from docker-build.yml (which builds the
# app image) so it shows as its own check. Public repo: GitHub-hosted runner only.
# Node 24: vitest 5 requires ^22.12 || ^24 || >=26.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'notez-mcp/**'
      - '.github/workflows/notez-mcp.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'notez-mcp/**'
      - '.github/workflows/notez-mcp.yml'

concurrency:
  group: notez-mcp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  notez-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install notez-mcp dependencies
        run: npm ci
        working-directory: notez-mcp
      - name: Run notez-mcp tests
        run: npm test
        working-directory: notez-mcp
      - name: Build notez-mcp
        run: npm run build
        working-directory: notez-mcp
