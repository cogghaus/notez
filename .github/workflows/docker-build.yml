name: Build and Push Docker Image
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Backend: install, generate, test, build
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend
      - name: Type-check backend
        run: npm run typecheck
        working-directory: backend
      # Ratchet: 544 pre-existing errors (513 of them @typescript-eslint/no-explicit-any). The step
      # fails if the error count rises above the baseline. Lower LINT_BASELINE as findings are fixed.
      - name: Lint backend (ratchet)
        env:
          LINT_BASELINE: '544'
        run: |
          npx eslint src -f json -o eslint-report.json || true
          COUNT=$(node -e "const r=require('./eslint-report.json');console.log(r.reduce((n,f)=>n+f.errorCount,0))")
          echo "ESLint errors: $COUNT (baseline $LINT_BASELINE)"
          if [ "$COUNT" -gt "$LINT_BASELINE" ]; then
            echo "::error::ESLint errors rose above the baseline ($COUNT > $LINT_BASELINE)"
            exit 1
          fi
        working-directory: backend
      - name: Run backend tests
        run: npx vitest run
        working-directory: backend
      - name: Audit backend dependencies
        run: npm audit --audit-level=high || echo "::warning::npm audit found high+ vulnerabilities"
        working-directory: backend
      - name: Build backend (esbuild transpilation)
        run: npm run build
        working-directory: backend

      # Frontend: install, test, build
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Run frontend tests
        run: npx vitest run
        working-directory: frontend
      - name: Type-check frontend e2e
        run: npm run typecheck:e2e
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend

      # Docker: build image using pre-built artifacts
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
      - name: Output image tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: echo "Image tags - $TAGS"
