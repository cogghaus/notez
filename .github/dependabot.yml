# Dependabot configuration.
#
# Without this file only *security* updates are raised, and only for manifests
# GitHub happens to detect. That left notez-mcp/ with no update PRs at all
# despite carrying 51 open alerts, while backend/ and frontend/ were covered.
# Declaring all three ecosystems makes coverage explicit and adds regular
# version updates so security fixes are not the only thing that ever lands.
#
# Updates are grouped per directory to keep the PR count manageable: one PR for
# production dependencies and one for development dependencies, rather than one
# per package.
#
# Major bumps are ignored for scheduled version updates. The groups below only
# cover minor and patch, so without this every major fell outside a group and
# got its own PR -- the first run opened 14 of them at once, including
# typescript 5.9 -> 7.0, zod 3 -> 4 and @types/node 20 -> 26. Majors deserve a
# deliberate look rather than arriving as routine weekly noise, so they are
# raised manually instead.
#
# This does not weaken security coverage: Dependabot security updates are driven
# by advisories, not by this schedule, and still open PRs for vulnerable
# packages regardless of whether the fix is a major.

version: 2

updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      backend-production:
        dependency-type: production
        update-types:
          - minor
          - patch
      backend-development:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      frontend-production:
        dependency-type: production
        update-types:
          - minor
          - patch
      frontend-development:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)

  - package-ecosystem: npm
    directory: /notez-mcp
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      notez-mcp-production:
        dependency-type: production
        update-types:
          - minor
          - patch
      notez-mcp-development:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)

  # Keep the Actions used by docker-build.yml current as well.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: chore(ci)
