/* ---------- tasks ---------- */
function filteredTasks() { const f = S.tf, q = f.q.trim().toLowerCase(); return TASKS.filter(t => (!f.priority || t.priority === f.priority) && (!f.folder || t.folder === f.folder) && (!f.tag || t.tags.includes(f.tag)) && (!q || t.title.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q) || t.tags.some(x => x.includes(q)))); }
function groupTasks(list) {

  list.forEach(t => { if (t.deleted) { g.deleted.push(t); return; } if (t.status === 'COMPLETED' || t.status === 'CANCELLED') { if (S.tf.done || (t.status === 'COMPLETED' && t.completedAt && isoDate(t.completedAt) === TODAY_ISO)) g.completed.push(t); return; } const d = t.due ? isoDate(t.due) : null; if (!d) g.nodate.push(t); else if (d < TODAY_ISO) g.overdue.push(t); else if (d === TODAY_ISO) g.today.push(t); else g.upcoming.push(t); });

function groupHeader(id, lbl, count, cls) { const open = !S.collapsed[id]; return `<h3 class="sticky top-0 z-10 bg-white dark:bg-gray-900"><button type="button" id="g-${id}" data-act="toggle-group" data-g="${id}" aria-expanded="${open}" class="w-full min-h-9 px-3 flex items-center gap-1.5 text-xs font-semibold uppercase tracking-wide border-b border-gray-100 dark:border-gray-800 ${cls}">${I(open ? 'chevron-down' : 'chevron-right', 'w-4 h-4')}${lbl}<span class="rounded-full px-1.5 text-xs bg-gray-100 dark:bg-gray-800">${count}</span></button></h3>`; }

  ['Notes list', { tab: 'notes' }], ['Filter sheet', { tab: 'notes', sheet: 'filter' }], ['Editor, reading', { tab: 'notes', noteId: 'n3' }], ['Editor, writing (keyboard)', { tab: 'notes', noteId: 'n3', kb: true, focus: 'editor', region: true }], ['Details sheet', { tab: 'notes', noteId: 'n3', sheet: 'details' }], ['Shared note (presence)', { tab: 'notes', noteId: 'n4' }], ['Trash view', { tab: 'notes', view: 'trash' }],
